<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quantum Light Live Receiver</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101216;
      color: #e7eaf0;
    }

    body {
      margin: 0;
      padding: 24px;
    }

    .panel {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar, .controls, .add-form, .spectrum-controls {
      display: grid;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .topbar {
      grid-template-columns: 1fr auto auto;
    }

    .controls {
      grid-template-columns: 1fr auto auto;
    }

    .spectrum-controls {
      grid-template-columns: auto auto auto 1fr auto;
      margin-top: 16px;
    }

    .add-form {
      grid-template-columns: 1.2fr 1fr auto auto auto;
      background: #181c23;
      border: 1px solid #2a303b;
      border-radius: 10px;
      padding: 12px;
    }

    input, button, select, label.checkbox {
      border: 1px solid #3a4250;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      background: #181c23;
      color: #e7eaf0;
    }

    label.checkbox {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      padding: 0;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      border-color: #2563eb;
      white-space: nowrap;
    }

    button.secondary {
      background: #262c36;
      border-color: #3a4250;
    }

    button.danger {
      background: #7f1d1d;
      border-color: #991b1b;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color: #9ca3af;
      font-size: 12px;
    }

    .device-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .device {
      text-align: left;
      background: #181c23;
      border: 1px solid #2a303b;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }

    .device:hover, .device.selected {
      border-color: #60a5fa;
    }

    .device strong {
      display: block;
      margin-bottom: 6px;
    }

    .device small {
      display: block;
      color: #9ca3af;
      line-height: 1.45;
    }

    .device-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .device-actions button {
      padding: 7px 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: #181c23;
      border: 1px solid #2a303b;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat label {
      display: block;
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat span {
      font-variant-numeric: tabular-nums;
    }

    canvas {
      width: 100%;
      height: 520px;
      display: block;
      background: #07090d;
      border: 1px solid #2a303b;
      border-radius: 12px;
    }

    .spectrum-canvas {
      height: 360px;
    }

    .readout {
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
      justify-self: end;
      min-width: 220px;
      text-align: right;
    }

    .message {
      margin-top: 12px;
      color: #fbbf24;
      min-height: 24px;
      white-space: pre-wrap;
    }

    .toast-region {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      display: grid;
      gap: 10px;
      width: min(420px, calc(100vw - 36px));
      pointer-events: none;
    }

    .toast {
      background: #181c23;
      border: 1px solid #3a4250;
      border-left: 4px solid #f59e0b;
      border-radius: 8px;
      box-shadow: 0 14px 36px rgb(0 0 0 / 0.35);
      color: #e7eaf0;
      line-height: 1.4;
      padding: 12px 14px;
      pointer-events: auto;
    }

    .toast.error {
      border-left-color: #ef4444;
    }

    .toast strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .toast span {
      color: #cbd5e1;
      display: block;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .topbar, .controls, .add-form, .spectrum-controls {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .readout {
        justify-self: start;
        min-width: 0;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <main class="panel">
    <h1>Quantum Light Live Receiver</h1>

    <div class="topbar">
      <input id="apiBase" />
      <button id="refresh" class="secondary">Refresh Red Pitayas</button>
      <button id="showAdd">Add one</button>
    </div>

    <form id="addForm" class="add-form hidden">
      <input id="newName" placeholder="Name" value="Red Pitaya" />
      <input id="newHost" placeholder="Host or IP, e.g. 192.168.1.65" required />
      <label class="checkbox"><input id="newCh1" type="checkbox" checked /> CH1</label>
      <label class="checkbox"><input id="newCh2" type="checkbox" /> CH2</label>
      <button type="submit">Create</button>
    </form>

    <div id="devices" class="device-list"></div>

    <div class="controls">
      <input id="url" readonly />
      <button id="connect" disabled>Connect selected</button>
      <button id="disconnect" class="danger" disabled>Disconnect socket</button>
    </div>

    <div class="stats">
      <div class="stat"><label>Status</label><span id="status">disconnected</span></div>
      <div class="stat"><label>Selected</label><span id="selected">-</span></div>
      <div class="stat"><label>Frames</label><span id="frames">0</span></div>
      <div class="stat"><label>Sequence</label><span id="sequence">-</span></div>
      <div class="stat"><label>Sample rate</label><span id="rate">-</span></div>
      <div class="stat"><label>Samples/channel</label><span id="samples">-</span></div>
      <div class="stat"><label>CH mask</label><span id="mask">-</span></div>
      <div class="stat"><label>CH1 min/max</label><span id="ch1range">-</span></div>
      <div class="stat"><label>CH2 min/max</label><span id="ch2range">-</span></div>
      <div class="stat"><label>FPGA lost CH1</label><span id="lost1">0</span></div>
      <div class="stat"><label>FPGA lost CH2</label><span id="lost2">0</span></div>
      <div class="stat"><label>Flags</label><span id="flags">0</span></div>
    </div>

    <canvas id="plot" width="1400" height="520"></canvas>

    <div class="spectrum-controls">
      <div class="field">
        <label for="spectrumChannel">Spectrum channel</label>
        <select id="spectrumChannel">
          <option value="ch1">CH1</option>
          <option value="ch2">CH2</option>
        </select>
      </div>
      <div class="field">
        <label for="fftSize">FFT size</label>
        <select id="fftSize">
          <option value="1024">1024</option>
          <option value="2048">2048</option>
          <option value="4096" selected>4096</option>
          <option value="8192">8192</option>
          <option value="16384">16384</option>
        </select>
      </div>
      <div class="field">
        <label for="spectrumScale">Scale</label>
        <select id="spectrumScale">
          <option value="db" selected>dBFS</option>
          <option value="linear">Linear</option>
        </select>
      </div>
      <div></div>
      <div id="spectrumPeak" class="readout">Peak: -</div>
    </div>
    <canvas id="spectrum" class="spectrum-canvas" width="1400" height="360"></canvas>
    <div id="message" class="message"></div>
  </main>

  <script>
    const HEADER_SIZE = 80;
    const MAGIC = "RPA1";
    const MAX_POINTS = 4096;
    const SPECTRUM_MIN_INTERVAL_MS = 120;

    const defaultApiBase = location.protocol.startsWith("http")
      ? location.origin
      : "http://127.0.0.1:8080";

    const els = {
      apiBase: document.getElementById("apiBase"),
      refresh: document.getElementById("refresh"),
      showAdd: document.getElementById("showAdd"),
      addForm: document.getElementById("addForm"),
      newName: document.getElementById("newName"),
      newHost: document.getElementById("newHost"),
      newCh1: document.getElementById("newCh1"),
      newCh2: document.getElementById("newCh2"),
      devices: document.getElementById("devices"),
      url: document.getElementById("url"),
      connect: document.getElementById("connect"),
      disconnect: document.getElementById("disconnect"),
      status: document.getElementById("status"),
      selected: document.getElementById("selected"),
      frames: document.getElementById("frames"),
      sequence: document.getElementById("sequence"),
      rate: document.getElementById("rate"),
      samples: document.getElementById("samples"),
      mask: document.getElementById("mask"),
      ch1range: document.getElementById("ch1range"),
      ch2range: document.getElementById("ch2range"),
      lost1: document.getElementById("lost1"),
      lost2: document.getElementById("lost2"),
      flags: document.getElementById("flags"),
      spectrumChannel: document.getElementById("spectrumChannel"),
      fftSize: document.getElementById("fftSize"),
      spectrumScale: document.getElementById("spectrumScale"),
      spectrumPeak: document.getElementById("spectrumPeak"),
      message: document.getElementById("message"),
      toastRegion: document.getElementById("toastRegion"),
      canvas: document.getElementById("plot"),
      spectrum: document.getElementById("spectrum"),
    };

    const ctx = els.canvas.getContext("2d");
    const spectrumCtx = els.spectrum.getContext("2d");
    let socket = null;
    let frameCount = 0;
    let devices = [];
    let selectedDevice = null;
    let latestFrame = null;
    let lastSpectrumDrawAt = 0;

    els.apiBase.value = defaultApiBase;

    function apiBase() {
      return els.apiBase.value.trim().replace(/\/$/, "");
    }

    function wsBase() {
      const base = new URL(apiBase());
      base.protocol = base.protocol === "https:" ? "wss:" : "ws:";
      return base.origin;
    }

    function deviceSocketUrl(deviceId) {
      return `${wsBase()}/ws/v1/devices/${deviceId}/samples`;
    }

    function setStatus(value, message = "") {
      els.status.textContent = value;
      els.message.textContent = message;
    }

    function showToast(title, message, variant = "error") {
      const toast = document.createElement("div");
      toast.className = `toast ${variant}`;
      toast.innerHTML = `
        <strong>${escapeHtml(title)}</strong>
        <span>${escapeHtml(message)}</span>
      `;
      els.toastRegion.append(toast);
      window.setTimeout(() => toast.remove(), 6500);
    }

    function showError(error) {
      const message = error instanceof Error ? error.message : String(error);
      const title = message.includes("already exists") ? "Red Pitaya Already Added" : "Request Failed";
      setStatus("error", message);
      showToast(title, message);
    }

    async function api(path, options = {}) {
      const response = await fetch(`${apiBase()}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      if (!response.ok) {
        let detail = `${response.status} ${response.statusText}`;
        try {
          const body = await response.json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch {
          // Keep HTTP status detail.
        }
        throw new Error(detail);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    async function loadDevices() {
      setStatus("loading devices");
      const all = await api("/api/v1/devices");
      devices = all.filter((device) => device.source === "redpitaya");
      if (selectedDevice && !devices.some((device) => device.id === selectedDevice.id)) {
        selectedDevice = null;
      }
      renderDevices();
      setStatus(socket ? "connected" : "disconnected");
    }

    function renderDevices() {
      els.devices.replaceChildren();
      if (devices.length === 0) {
        const empty = document.createElement("div");
        empty.className = "device";
        empty.innerHTML = "<strong>No Red Pitayas registered</strong><small>Use “Add one” to create a profile.</small>";
        els.devices.append(empty);
        return;
      }

      for (const device of devices) {
        const runtime = device.runtime || {};
        const item = document.createElement("div");
        const channels = `${device.channel1Enabled ? "CH1 " : ""}${device.channel2Enabled ? "CH2" : ""}`.trim();
        item.className = `device${selectedDevice?.id === device.id ? " selected" : ""}`;
        item.innerHTML = `
          <strong>${escapeHtml(device.name)}</strong>
          <small>Host: ${escapeHtml(device.host || "-")}</small>
          <small>State: ${escapeHtml(runtime.state || "-")}</small>
          <small>Channels: ${escapeHtml(channels || "-")}</small>
          <div class="device-actions">
            <button type="button" class="secondary" data-channel="2">
              ${device.channel2Enabled ? "Disable CH2" : "Enable CH2"}
            </button>
          </div>
        `;
        item.addEventListener("click", () => {
          selectDevice(device);
          connectSelected();
        });
        item.querySelector("[data-channel='2']").addEventListener("click", (event) => {
          event.stopPropagation();
          updateDeviceChannels(device, { channel2Enabled: !device.channel2Enabled }).catch(showError);
        });
        els.devices.append(item);
      }
    }

    function selectDevice(device) {
      selectedDevice = device;
      els.selected.textContent = `${device.name} (${device.host})`;
      els.url.value = deviceSocketUrl(device.id);
      els.connect.disabled = false;
      renderDevices();
    }

    async function createDevice(event) {
      event.preventDefault();
      if (!els.newCh1.checked && !els.newCh2.checked) {
        showError(new Error("Enable at least one channel."));
        return;
      }

      const body = {
        name: els.newName.value.trim() || els.newHost.value.trim(),
        source: "redpitaya",
        host: els.newHost.value.trim(),
        enabled: true,
        isDefault: false,
        channel1Enabled: els.newCh1.checked,
        channel2Enabled: els.newCh2.checked,
        decimation: 256,
        blockSizeBytes: 131072,
        adcBufferSizeBytes: 4194304,
        streamingModulePath: null,
        simulatorSamplesPerPacket: 4096,
        simulatorSeed: 1,
      };

      try {
        setStatus("creating device");
        const created = await api("/api/v1/devices", { method: "POST", body: JSON.stringify(body) });
        els.addForm.classList.add("hidden");
        await loadDevices();
        selectDevice(created);
      } catch (error) {
        showError(error);
      }
    }

    function editableProfilePayload(device) {
      return {
        name: device.name,
        source: device.source,
        host: device.host,
        enabled: device.enabled,
        isDefault: device.isDefault,
        channel1Enabled: device.channel1Enabled,
        channel2Enabled: device.channel2Enabled,
        decimation: device.decimation,
        blockSizeBytes: device.blockSizeBytes,
        adcBufferSizeBytes: device.adcBufferSizeBytes,
        streamingModulePath: device.streamingModulePath,
        simulatorSamplesPerPacket: device.simulatorSamplesPerPacket,
        simulatorSeed: device.simulatorSeed,
      };
    }

    async function updateDeviceChannels(device, changes) {
      const body = { ...editableProfilePayload(device), ...changes };
      if (!body.channel1Enabled && !body.channel2Enabled) {
        showError(new Error("Enable at least one channel."));
        return;
      }

      try {
        if (socket && selectedDevice?.id === device.id) {
          socket.close();
        }
        const state = device.runtime?.state;
        if (state === "streaming") {
          await api(`/api/v1/devices/${device.id}/stop`, { method: "POST" });
        }
        if (state === "streaming" || state === "ready") {
          await api(`/api/v1/devices/${device.id}/disconnect`, { method: "POST" });
        }

        setStatus("updating device", device.name);
        const updated = await api(`/api/v1/devices/${device.id}`, {
          method: "PUT",
          body: JSON.stringify(body),
        });
        await loadDevices();
        selectDevice(updated);
      } catch (error) {
        showError(error);
      }
    }

    async function connectSelected() {
      if (!selectedDevice || socket) return;
      try {
        frameCount = 0;
        els.frames.textContent = "0";
        setStatus("starting device", selectedDevice.name);
        await api(`/api/v1/devices/${selectedDevice.id}/connect`, { method: "POST" });
        await api(`/api/v1/devices/${selectedDevice.id}/start`, { method: "POST" });
        connectSocket(selectedDevice.id);
        await loadDevices();
      } catch (error) {
        showError(error);
      }
    }

    function connectSocket(deviceId) {
      if (socket) return;
      setStatus("connecting socket");
      els.url.value = deviceSocketUrl(deviceId);
      socket = new WebSocket(els.url.value);
      socket.binaryType = "arraybuffer";

      socket.addEventListener("open", () => {
        els.connect.disabled = true;
        els.disconnect.disabled = false;
        setStatus("connected");
      });
      socket.addEventListener("message", handleMessage);
      socket.addEventListener("close", () => {
        socket = null;
        els.connect.disabled = !selectedDevice;
        els.disconnect.disabled = true;
        setStatus("disconnected");
      });
      socket.addEventListener("error", () => {
        showError(new Error("WebSocket error. Check that the service is running and the device is started."));
      });
    }

    function disconnectSocket() {
      if (socket) {
        socket.close();
      }
    }

    function parseFrame(buffer) {
      if (buffer.byteLength < HEADER_SIZE) {
        throw new Error(`message too short: ${buffer.byteLength} bytes`);
      }

      const view = new DataView(buffer);
      const magic = String.fromCharCode(
        view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3)
      );
      const version = view.getUint8(4);
      const channelMask = view.getUint8(5);
      const headerSize = view.getUint16(6, true);
      if (magic !== MAGIC || version !== 1 || headerSize !== HEADER_SIZE) {
        throw new Error(`unsupported frame: magic=${magic}, version=${version}, header=${headerSize}`);
      }

      const sequence = view.getBigUint64(16, true);
      const sampleRateHz = view.getFloat64(40, true);
      const samplesPerChannel = view.getUint32(52, true);
      const payloadBytes = view.getUint32(56, true);
      const flags = view.getUint32(60, true);
      const fpgaLostCh1 = view.getBigUint64(64, true);
      const fpgaLostCh2 = view.getBigUint64(72, true);

      if (buffer.byteLength < HEADER_SIZE + payloadBytes) {
        throw new Error(`payload truncated: expected ${payloadBytes} bytes`);
      }

      let relativeOffset = 0;
      const allSamples = new Int16Array(buffer, HEADER_SIZE, payloadBytes / 2);
      let ch1 = null;
      let ch2 = null;

      if (channelMask & 1) {
        ch1 = allSamples.subarray(relativeOffset, relativeOffset + samplesPerChannel);
        relativeOffset += samplesPerChannel;
      }
      if (channelMask & 2) {
        ch2 = allSamples.subarray(relativeOffset, relativeOffset + samplesPerChannel);
      }

      return {
        channelMask,
        sequence,
        sampleRateHz,
        samplesPerChannel,
        flags,
        fpgaLostCh1,
        fpgaLostCh2,
        ch1,
        ch2,
      };
    }

    function range(samples) {
      if (!samples || samples.length === 0) return null;
      let min = 32767;
      let max = -32768;
      for (let i = 0; i < samples.length; i++) {
        const value = samples[i];
        if (value < min) min = value;
        if (value > max) max = value;
      }
      return { min, max };
    }

    function downsample(samples, maxPoints) {
      if (!samples || samples.length <= maxPoints) return samples;
      const step = samples.length / maxPoints;
      const output = new Int16Array(maxPoints);
      for (let i = 0; i < maxPoints; i++) {
        output[i] = samples[Math.floor(i * step)];
      }
      return output;
    }

    function drawGrid(width, height) {
      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= width; x += width / 10) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
      }
      for (let y = 0; y <= height; y += height / 8) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
      }
      ctx.stroke();

      ctx.strokeStyle = "#374151";
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
    }

    function drawChannel(samples, color, yOffset, yScale, width) {
      if (!samples || samples.length < 2) return;
      const data = downsample(samples, MAX_POINTS);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = (i / (data.length - 1)) * width;
        const y = yOffset - data[i] * yScale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function fft(real, imag) {
      const n = real.length;
      for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) {
          j ^= bit;
        }
        j ^= bit;
        if (i < j) {
          [real[i], real[j]] = [real[j], real[i]];
          [imag[i], imag[j]] = [imag[j], imag[i]];
        }
      }

      for (let size = 2; size <= n; size <<= 1) {
        const half = size >> 1;
        const angleStep = (-2 * Math.PI) / size;
        for (let start = 0; start < n; start += size) {
          for (let i = 0; i < half; i++) {
            const angle = angleStep * i;
            const wr = Math.cos(angle);
            const wi = Math.sin(angle);
            const even = start + i;
            const odd = even + half;
            const tr = wr * real[odd] - wi * imag[odd];
            const ti = wr * imag[odd] + wi * real[odd];
            real[odd] = real[even] - tr;
            imag[odd] = imag[even] - ti;
            real[even] += tr;
            imag[even] += ti;
          }
        }
      }
    }

    function computeSpectrum(samples, sampleRateHz, requestedSize) {
      if (!samples || samples.length < 2) return null;
      let fftSize = 1;
      const limit = Math.min(requestedSize, samples.length);
      while ((fftSize << 1) <= limit) fftSize <<= 1;
      if (fftSize < 16) return null;

      const start = samples.length - fftSize;
      const real = new Float64Array(fftSize);
      const imag = new Float64Array(fftSize);
      let mean = 0;
      for (let i = 0; i < fftSize; i++) {
        mean += samples[start + i];
      }
      mean /= fftSize;

      let windowSum = 0;
      for (let i = 0; i < fftSize; i++) {
        const windowValue = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (fftSize - 1));
        windowSum += windowValue;
        real[i] = (samples[start + i] - mean) * windowValue;
      }

      fft(real, imag);

      const binCount = fftSize / 2;
      const magnitudes = new Float64Array(binCount);
      let peakIndex = 1;
      let peakMagnitude = 0;
      for (let i = 0; i < binCount; i++) {
        const singleSided = i === 0 ? 1 : 2;
        const magnitude = (singleSided * Math.hypot(real[i], imag[i])) / (windowSum * 32768);
        magnitudes[i] = magnitude;
        if (i > 0 && magnitude > peakMagnitude) {
          peakMagnitude = magnitude;
          peakIndex = i;
        }
      }

      return {
        fftSize,
        magnitudes,
        binHz: sampleRateHz / fftSize,
        nyquistHz: sampleRateHz / 2,
        peakHz: peakIndex * sampleRateHz / fftSize,
        peakDb: 20 * Math.log10(Math.max(peakMagnitude, 1e-12)),
      };
    }

    function drawSpectrumGrid(width, height, plot, nyquistHz) {
      const { left, top, right, bottom } = plot;
      spectrumCtx.strokeStyle = "#1f2937";
      spectrumCtx.lineWidth = 1;
      spectrumCtx.beginPath();
      for (let i = 0; i <= 10; i++) {
        const x = left + ((width - left - right) * i) / 10;
        spectrumCtx.moveTo(x, top);
        spectrumCtx.lineTo(x, height - bottom);
      }
      for (let i = 0; i <= 6; i++) {
        const y = top + ((height - top - bottom) * i) / 6;
        spectrumCtx.moveTo(left, y);
        spectrumCtx.lineTo(width - right, y);
      }
      spectrumCtx.stroke();

      spectrumCtx.fillStyle = "#9ca3af";
      spectrumCtx.font = "12px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      spectrumCtx.fillText("0 dBFS", 10, top + 15);
      spectrumCtx.fillText("-120", 10, height - bottom - 3);
      spectrumCtx.fillText("0 Hz", left, height - 9);
      spectrumCtx.textAlign = "right";
      spectrumCtx.fillText(formatHz(nyquistHz), width - right, height - 9);
      spectrumCtx.textAlign = "left";
    }

    function drawSpectrum(frame, force = false) {
      const now = performance.now();
      if (!force && frame && now - lastSpectrumDrawAt < SPECTRUM_MIN_INTERVAL_MS) return;
      lastSpectrumDrawAt = now;

      const width = els.spectrum.width;
      const height = els.spectrum.height;
      spectrumCtx.clearRect(0, 0, width, height);
      spectrumCtx.fillStyle = "#07090d";
      spectrumCtx.fillRect(0, 0, width, height);

      const plot = { left: 58, top: 18, right: 16, bottom: 34 };
      drawSpectrumGrid(width, height, plot, frame ? frame.sampleRateHz / 2 : 0);

      if (!frame) {
        els.spectrumPeak.textContent = "Peak: -";
        return;
      }

      const channelName = els.spectrumChannel.value;
      const samples = channelName === "ch2" ? frame.ch2 : frame.ch1;
      if (!samples) {
        spectrumCtx.fillStyle = "#9ca3af";
        spectrumCtx.fillText(`${channelName.toUpperCase()} is not enabled`, plot.left + 12, plot.top + 24);
        els.spectrumPeak.textContent = "Peak: -";
        return;
      }

      const spectrum = computeSpectrum(samples, frame.sampleRateHz, Number(els.fftSize.value));
      if (!spectrum) {
        els.spectrumPeak.textContent = "Peak: -";
        return;
      }

      const plotWidth = width - plot.left - plot.right;
      const plotHeight = height - plot.top - plot.bottom;
      const useDb = els.spectrumScale.value === "db";
      const minDb = -120;
      const maxDb = 0;
      const maxLinear = Math.max(0.000001, ...spectrum.magnitudes);

      spectrumCtx.strokeStyle = channelName === "ch2" ? "#38bdf8" : "#22c55e";
      spectrumCtx.lineWidth = 1.7;
      spectrumCtx.beginPath();
      for (let i = 0; i < spectrum.magnitudes.length; i++) {
        const x = plot.left + (i / (spectrum.magnitudes.length - 1)) * plotWidth;
        const value = spectrum.magnitudes[i];
        const normalized = useDb
          ? (20 * Math.log10(Math.max(value, 1e-12)) - minDb) / (maxDb - minDb)
          : value / maxLinear;
        const y = plot.top + (1 - Math.max(0, Math.min(1, normalized))) * plotHeight;
        if (i === 0) spectrumCtx.moveTo(x, y);
        else spectrumCtx.lineTo(x, y);
      }
      spectrumCtx.stroke();

      if (!useDb) {
        spectrumCtx.fillStyle = "#cbd5e1";
        spectrumCtx.clearRect(3, plot.top + 2, plot.left - 7, 18);
        spectrumCtx.fillText("max", 10, plot.top + 15);
        spectrumCtx.clearRect(3, height - plot.bottom - 17, plot.left - 7, 18);
        spectrumCtx.fillText("0", 10, height - plot.bottom - 3);
      }
      els.spectrumPeak.textContent = `Peak: ${formatHz(spectrum.peakHz)} / ${spectrum.peakDb.toFixed(1)} dBFS`;
    }

    function formatHz(value) {
      if (!Number.isFinite(value)) return "-";
      if (value >= 1_000_000) return `${(value / 1_000_000).toFixed(2)} MHz`;
      if (value >= 1_000) return `${(value / 1_000).toFixed(2)} kHz`;
      return `${value.toFixed(1)} Hz`;
    }

    function draw(frame) {
      const width = els.canvas.width;
      const height = els.canvas.height;
      ctx.clearRect(0, 0, width, height);
      drawGrid(width, height);

      const ch1Range = range(frame.ch1);
      const ch2Range = range(frame.ch2);
      const combinedAbsMax = Math.max(
        1,
        Math.abs(ch1Range?.min ?? 0), Math.abs(ch1Range?.max ?? 0),
        Math.abs(ch2Range?.min ?? 0), Math.abs(ch2Range?.max ?? 0),
      );
      const yScale = (height * 0.42) / combinedAbsMax;

      drawChannel(frame.ch1, "#22c55e", height / 2, yScale, width);
      drawChannel(frame.ch2, "#38bdf8", height / 2, yScale, width);

      ctx.fillStyle = "#22c55e";
      ctx.fillText("CH1", 12, 22);
      if (frame.ch2) {
        ctx.fillStyle = "#38bdf8";
        ctx.fillText("CH2", 58, 22);
      }

      els.ch1range.textContent = ch1Range ? `${ch1Range.min} / ${ch1Range.max}` : "-";
      els.ch2range.textContent = ch2Range ? `${ch2Range.min} / ${ch2Range.max}` : "-";
      drawSpectrum(frame);
    }

    async function handleMessage(event) {
      try {
        const buffer = event.data instanceof ArrayBuffer
          ? event.data
          : await event.data.arrayBuffer();
        const frame = parseFrame(buffer);
        latestFrame = frame;
        frameCount += 1;

        els.frames.textContent = String(frameCount);
        els.sequence.textContent = frame.sequence.toString();
        els.rate.textContent = `${frame.sampleRateHz.toFixed(2)} Hz`;
        els.samples.textContent = String(frame.samplesPerChannel);
        els.mask.textContent = `0x${frame.channelMask.toString(16)}`;
        els.lost1.textContent = frame.fpgaLostCh1.toString();
        els.lost2.textContent = frame.fpgaLostCh2.toString();
        els.flags.textContent = String(frame.flags);

        draw(frame);
      } catch (error) {
        showError(error);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    els.refresh.addEventListener("click", () => {
      loadDevices().catch(showError);
    });
    els.showAdd.addEventListener("click", () => {
      els.addForm.classList.toggle("hidden");
      els.newHost.focus();
    });
    els.addForm.addEventListener("submit", createDevice);
    els.connect.addEventListener("click", connectSelected);
    els.disconnect.addEventListener("click", disconnectSocket);
    els.spectrumChannel.addEventListener("change", () => drawSpectrum(latestFrame, true));
    els.fftSize.addEventListener("change", () => drawSpectrum(latestFrame, true));
    els.spectrumScale.addEventListener("change", () => drawSpectrum(latestFrame, true));
    els.apiBase.addEventListener("change", () => {
      if (selectedDevice) {
        els.url.value = deviceSocketUrl(selectedDevice.id);
      }
      loadDevices().catch(showError);
    });

    drawGrid(els.canvas.width, els.canvas.height);
    drawSpectrum(null, true);
    loadDevices().catch(showError);
  </script>
</body>
</html>
