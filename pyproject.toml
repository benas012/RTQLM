[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-light-engine"
version = "0.2.0"
description = "Multi-device raw ADC acquisition engine for Red Pitaya STEMlab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2.4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
]

[project.scripts]
quantum-light-engine = "quantum_light_engine.cli:main"
quantum-light-receiver = "apps.native_receiver.native_receiver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redpitaya_acquisition", "src/quantum_light_engine", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["redpitaya_acquisition", "quantum_light_engine"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
